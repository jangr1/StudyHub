<!-- accounts/templates/accounts/edit_record.html -->
{% extends 'base.html' %}

{% block title %}기록 수정 - StudyHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark font-weight-bold">
                ✏️ 공부 기록 수정
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">과목/주제</label>
                        {{ form.subject }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">공부 시간(분)</label>
                        {{ form.duration_minutes }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">메모</label>
                        {{ form.memo }}
                    </div>
                    <div class="form-check mb-4">
                        {{ form.is_public }}
                        <label class="form-check-label" for="{{ form.is_public.id_for_label }}">
                            커뮤니티에 공개
                        </label>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'accounts:mypage' %}" class="btn btn-secondary btn-sm">취소</a>
                        <button type="submit" class="btn btn-warning btn-sm">수정 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

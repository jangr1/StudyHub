<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyHub{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <!-- 로고 클릭 시 메인 홈으로 이동 -->
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">StudyHub</a>
            
            <div class="collapse navbar-collapse">
                <!-- 왼쪽 메뉴: 공통 메뉴 -->
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'community:index' %}">커뮤니티</a>
                    </li>
                </ul>

                <!-- 오른쪽 메뉴: 로그인 상태에 따른 분기 처리 -->
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <span class="text-light small me-2"><strong>{{ user.username }}</strong>님</span>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:mypage' %}">마이페이지</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-danger btn-sm" href="{% url 'accounts:logout' %}">로그아웃</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:login' %}">로그인</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-primary btn-sm" href="{% url 'accounts:signup' %}">회원가입</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
